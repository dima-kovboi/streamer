<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — dimakovboi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08090c;
            --surface: #0e1117;
            --card: #141820;
            --accent: #00ff66;
            --accent-dim: #00cc52;
            --accent-glow: rgba(0,255,102,0.3);
            --orange: #ff8c00;
            --text: #fff;
            --text2: #a0a5b5;
            --text3: #6b7084;
            --border: rgba(0,255,102,0.15);
            --radius: 12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: var(--text2);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .back-link {
            display: block;
            text-align: center;
            color: var(--accent);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 0.7; }

        /* Form */
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
        }
        .form-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 16px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: end;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr 1fr;
            }
        }
        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-family: 'Orbitron', sans-serif;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--accent);
        }
        select option { background: var(--surface); }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-accent {
            background: var(--accent);
            color: var(--bg);
        }
        .btn-accent:hover {
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }
        .btn-orange {
            background: var(--orange);
            color: #fff;
        }
        .btn-orange:hover {
            box-shadow: 0 0 20px rgba(255,140,0,0.3);
            transform: translateY(-2px);
        }
        .btn-ghost {
            background: transparent;
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn-red {
            background: rgba(255,50,86,0.15);
            color: #ff3256;
            border: 1px solid rgba(255,50,86,0.3);
        }
        .btn-red:hover {
            background: rgba(255,50,86,0.3);
        }

        .btns-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        /* Event list */
        .event-list { margin-top: 16px; }
        .event-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
        .event-item:hover { border-color: var(--border); }
        .event-item .ev-type {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 100px;
            flex-shrink: 0;
        }
        .ev-type.stream {
            background: rgba(255,140,0,0.15);
            color: var(--orange);
            border: 1px solid rgba(255,140,0,0.3);
        }
        .ev-type.video {
            background: rgba(0,255,102,0.1);
            color: var(--accent);
            border: 1px solid rgba(0,255,102,0.25);
        }
        .event-item .ev-info {
            flex: 1;
            font-size: 0.95rem;
        }
        .event-item .ev-date {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--text3);
        }
        .event-item .ev-del {
            background: none;
            border: none;
            color: var(--text3);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
            transition: color 0.2s;
        }
        .event-item .ev-del:hover { color: #ff3256; }

        /* Status */
        .status {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-top: 16px;
            display: none;
        }
        .status.ok {
            display: block;
            background: rgba(0,255,102,0.1);
            border: 1px solid rgba(0,255,102,0.3);
            color: var(--accent);
        }

        .hint {
            text-align: center;
            color: var(--text3);
            font-size: 0.85rem;
            margin-top: 30px;
            line-height: 1.6;
        }
        .hint code {
            background: var(--card);
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--accent);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; На сайт</a>
        <h1>Админка</h1>
        <p class="subtitle">Редактируй расписание стримов</p>

        <!-- Add event form -->
        <div class="form-card">
            <h2>Добавить событие</h2>
            <div class="form-row">
                <div>
                    <label>Дата</label>
                    <input type="date" id="evDate">
                </div>
                <div>
                    <label>Время</label>
                    <input type="time" id="evTime">
                </div>
                <div>
                    <label>Название</label>
                    <input type="text" id="evTitle" placeholder="Стрим с...">
                </div>
                <div>
                    <label>Тип</label>
                    <select id="evType">
                        <option value="stream">Стрим</option>
                        <option value="video">Ролик</option>
                    </select>
                </div>
                <button class="btn btn-accent" onclick="addEvent()">+</button>
            </div>
        </div>

        <!-- Event list -->
        <div class="form-card">
            <h2>Расписание</h2>
            <div id="eventList" class="event-list"></div>
        </div>

        <!-- Actions -->
        <div class="form-card">
            <h2>Экспорт</h2>
            <div class="btns-row">
                <button class="btn btn-accent" onclick="downloadJSON()">Скачать schedule.json</button>
                <button class="btn btn-orange" onclick="copyJSON()">Копировать JSON</button>
                <button class="btn btn-ghost" onclick="clearAll()">Очистить всё</button>
            </div>
            <div id="status" class="status"></div>
            <p class="hint">
                После скачивания — замени <code>schedule.json</code> в папке сайта и закоммить в GitHub.
            </p>
        </div>
    </div>

    <script>
    let events = JSON.parse(localStorage.getItem('dimakovboi_schedule') || '[]');

    // Fallback: загружаем из JSON файла если localStorage пуст
    if (events.length === 0) {
        fetch('schedule.json')
            .then(r => r.json())
            .then(data => {
                if (data.events) {
                    events = data.events;
                    localStorage.setItem('dimakovboi_schedule', JSON.stringify(events));
                    render();
                }
            })
            .catch(() => {});
    }

    function save() {
        localStorage.setItem('dimakovboi_schedule', JSON.stringify(events));
    }

    function render() {
        const list = document.getElementById('eventList');
        if (events.length === 0) {
            list.innerHTML = '<div style="color:var(--text3);text-align:center;padding:20px;">Нет событий</div>';
            return;
        }
        events.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
        list.innerHTML = events.map((e, i) => `
            <div class="event-item">
                <span class="ev-type ${e.type}">${e.type === 'stream' ? 'Стрим' : 'Ролик'}</span>
                <span class="ev-info">${e.title}</span>
                <span class="ev-date">${e.date} ${e.time}</span>
                <button class="ev-del" onclick="delEvent(${i})">&times;</button>
            </div>
        `).join('');
    }

    function addEvent() {
        const date = document.getElementById('evDate').value;
        const time = document.getElementById('evTime').value;
        const title = document.getElementById('evTitle').value.trim();
        const type = document.getElementById('evType').value;
        if (!date || !time || !title) return;
        events.push({ date, time, title, type });
        save();
        render();
        document.getElementById('evTitle').value = '';
        showStatus('Событие добавлено');
    }

    function delEvent(i) {
        events.splice(i, 1);
        save();
        render();
        showStatus('Событие удалено');
    }

    function clearAll() {
        if (!confirm('Удалить все события?')) return;
        events = [];
        save();
        render();
        showStatus('Всё очищено');
    }

    function downloadJSON() {
        const blob = new Blob([JSON.stringify({ events }, null, 4)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'schedule.json';
        a.click();
        showStatus('Файл скачан — замени в папке сайта');
    }

    function copyJSON() {
        navigator.clipboard.writeText(JSON.stringify({ events }, null, 4));
        showStatus('JSON скопирован');
    }

    function showStatus(msg) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = 'status ok';
        setTimeout(() => el.className = 'status', 2000);
    }

    render();
    </script>
</body>
</html>
